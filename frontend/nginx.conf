server {
    listen 80;

    # Serve the built React app for everything else
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # try_files with a fallback to index.html is required for
        # client-side routing (React Router etc.) to work -- without
        # it, refreshing on any route other than "/" would 404.
        try_files $uri $uri/ /index.html;
    }

    # "backend" here is the docker-compose SERVICE NAME, not a real
    # domain -- Docker's internal networking resolves it automatically
    # when both containers are on the same compose network. This is
    # the production equivalent of Vite's dev-server proxy -- same job,
    # different tool, so the frontend code (fetch('/api/...')) never
    # needs to change between dev and production.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
